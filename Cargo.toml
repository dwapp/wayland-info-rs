[package]
name = "wayland-info-rs"
version = "0.1.2"
edition = "2021"
description = "Rust implementation of wayland-info for inspecting Wayland compositor globals and protocol capabilities."
license = "MIT"
readme = "README.md"
repository = "https://github.com/dwapp/wayland-info-rs"
homepage = "https://github.com/dwapp/wayland-info-rs"
documentation = "https://github.com/dwapp/wayland-info-rs/blob/main/USAGE.md"

[dependencies]
colored = "3.0.0"
argh = "0.1"
wayland-client = "0.31.7"
wayland-protocols = { version = "0.32.10", features = ["staging", "unstable", "client"] }
wayland-protocols-treeland = { version = "0.1.2", features = ["client"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package.metadata.deb]
maintainer = "dwapp <dwapp@users.noreply.github.com>"
copyright = "2024 dwapp"
license-file = ["LICENSE", "0"]
depends = "libc6, libwayland-client0"
section = "utils"
priority = "optional"
extended-description = """Rust implementation of wayland-info for inspecting
Wayland compositor globals and protocol capabilities."""
assets = [
    ["target/release/wayland-info-rs", "usr/bin/wayland-info-rs", "755"],
    ["USAGE.md", "usr/share/doc/wayland-info-rs/USAGE.md", "644"],
    ["debian/changelog", "usr/share/doc/wayland-info-rs/changelog.Debian", "644"],
]
